# Binaries of the isoloir command (the pinned submodule) for the ledger's
# operators, authorities and auditors, and the container image the
# compose file runs. On a tag v*: a GitHub release with one archive per
# platform; on main: the image only, tagged by commit.
name: release
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["isoloir", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # isoloir is a private repository: a read deploy key of it, or a PAT.
          ssh-key: ${{ secrets.ISOLOIR_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: isoloir
      - run: cargo build --release -p isoloir --target ${{ matrix.target }}
        working-directory: isoloir
      - run: |
          set -e
          V=$(git -C isoloir rev-parse --short HEAD)
          mkdir -p out && cp isoloir/target/${{ matrix.target }}/release/isoloir out/
          cp -r isoloir/zkverifier out/zkverifier && rm -rf out/zkverifier/node_modules
          tar -C out -czf isoloir-${V}-${{ matrix.target }}.tar.gz .
          shasum -a 256 isoloir-${V}-${{ matrix.target }}.tar.gz > isoloir-${V}-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: isoloir-${{ matrix.target }}
          path: isoloir-*.tar.gz*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: isoloir-*.tar.gz*
          body: |
            The isoloir command at submodule commit `${{ github.sha }}`: ingest, authority, audit, keygen, circuits, check, submit, genesis.
            The ZKPassport verifier sidecar (`zkverifier/`) is in the archive; it needs node 22 and `npm ci` in that directory.
            `bb` 5.0.0 (from `@aztec/bb.js`) and, for building circuits, `nargo` 1.0.0-beta.22 are separate.

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ssh-key: ${{ secrets.ISOLOIR_DEPLOY_KEY }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/isoloir
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: isoloir
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
