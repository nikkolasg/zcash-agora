# The site: static pages in site/, plus the voting app (site/app, Vite) built
# on the vendored @isoloir/web (site/app/vendor, scripts/vendor-web.sh).
# Deployed to GitHub Pages at <owner>.github.io/<repo>/ (site/agora.config.json
# names the base path). Needs node only: no private checkout.
name: site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: site/app
      - run: python3 site/build-pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
