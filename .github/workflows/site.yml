# The site: static pages in site/, plus the voting app (site/app, Vite)
# built on @isoloir/web from the submodule (its wasm needs Rust). Deployed
# to GitHub Pages.
name: site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ssh-key: ${{ secrets.ISOLOIR_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: isoloir
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install wasm-pack --locked
      - run: npm ci && npm run wasm:web && npm run build
        working-directory: isoloir/js
      - run: npm ci && npm run build
        working-directory: site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
